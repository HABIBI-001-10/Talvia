  <title>TALVIA Consultancy | Education Without Borders</title>
  <script>
    // GitHub Pages SPA redirect for HashRouter
    var l = window.location;
    var pathname = l.pathname;
    if (pathname && pathname !== '/' && pathname !== '/index.html') {
      window.location.replace(l.protocol + '//' + l.host + '/#' + pathname + (l.search || '') + (l.hash || ''));
    } else {
      window.location.replace(l.protocol + '//' + l.host + '/');
    }
  </script>
</head>
